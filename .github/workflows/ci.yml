name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.Backporch/Jellyfin.Plugin.Backporch.csproj -c Release

      - name: Unit tests
        run: dotnet test Jellyfin.Plugin.Backporch.Tests/Jellyfin.Plugin.Backporch.Tests.csproj -c Release --filter "Category!=Integration"

      - name: Package
        run: DOTNET=dotnet ./package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: backporch
          path: dist/backporch_*.zip

  config-page-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Guided setup flow in headless Chromium
        run: node tests/ui/configpage.test.mjs

  issuance-against-pebble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Host networking so Pebble's HTTP-01 validation can reach the test's challenge
      # responder at 127.0.0.1:5002 (challtestsrv's own http01 server is disabled to
      # free that port). DNS-01 uses the same challtestsrv DNS as before.
      - name: Start Pebble test CA
        run: |
          docker run -d --name challtestsrv --network host \
            ghcr.io/letsencrypt/pebble-challtestsrv:latest -defaultIPv4 "" -defaultIPv6 "" -http01 ""
          # PEBBLE_AUTHZREUSE=100 makes every order reuse a previously validated
          # authorization — what Let's Encrypt does for ~30 days, and the state that
          # used to break re-issuance. Pebble also rejects a share of nonces on
          # purpose, which is how the missing badNonce retry surfaced.
          docker run -d --name pebble --network host -e PEBBLE_AUTHZREUSE=100 \
            ghcr.io/letsencrypt/pebble:latest -dnsserver 127.0.0.1:8053
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir >/dev/null && break
            sleep 1
          done

      - name: End-to-end issuance (DNS-01 and HTTP-01)
        env:
          BACKPORCH_PEBBLE_DIR: https://localhost:14000/dir
          BACKPORCH_CHALLTESTSRV: http://localhost:8055
          BACKPORCH_HTTP01_IP: 127.0.0.1
        run: dotnet test Jellyfin.Plugin.Backporch.Tests/Jellyfin.Plugin.Backporch.Tests.csproj -c Release --filter "Category=Integration"
