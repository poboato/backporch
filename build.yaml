---
# Jellyfin plugin build manifest, consumed by the jprm packaging tool
# (https://github.com/oddstr13/jellyfin-plugin-repository-manager).
name: "Backporch"
guid: "ec59d7bc-0644-4bfe-a924-b6ec7b88c1fb"
version: "0.1.0.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "poboato"
overview: "Automatic trusted TLS certificates for a self-hosted server."
description: >
  Automatically obtains and renews a Let's Encrypt certificate for your own
  domain, so remote access is encrypted with a certificate every device already
  trusts. By default the server answers the ownership challenge itself, with no
  DNS credentials to create; a DNS-01 route is available when port 80 is closed.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Backporch.dll"
  - "Backporch.Docker.dll"
  - "Certes.dll"
  - "BouncyCastle.Crypto.dll"
  - "Newtonsoft.Json.dll"
changelog: |
  Initial release: guided setup page, tokenless HTTP-01 issuance by default with
  DNS-01 (Cloudflare or manual) as a fallback, staging-first defaults, daily
  renewal task, admin-only API and configuration page. The plain-HTTP port is
  answered by the plugin's own listener, which serves the ownership proof and
  redirects everything else to HTTPS, so opening it never exposes the server;
  HTTPS responses carry Strict-Transport-Security. One certificate can carry
  several names, and can also be written in PEM form, so a reverse proxy in
  front of the machine's other applications can use the same certificate. The setup
  page can read the machine's container list and offer each application a name,
  leaving out the Docker API and flagging anything that hands over more than its
  own data.
